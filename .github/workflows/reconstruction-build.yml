name: Marrow reconstruction build

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/reconstruction-build.yml'
  push:
    branches: [source-fidelity/intern-mode-colors]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/reconstruction-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: test -x "$ANDROID_HOME/platform-tools/adb" || test -d "$ANDROID_HOME/platforms"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify independent package and launcher icon
        run: |
          grep -q 'applicationId .com.marrow.reconstruction.replica.' app/build.gradle
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marrow-reconstruction-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
