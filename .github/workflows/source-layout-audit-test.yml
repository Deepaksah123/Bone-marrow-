name: Source layout audit tests

on:
  push:
    paths:
      - "tools/audit_source_layouts.py"
      - "tools/test_audit_source_layouts.py"
      - ".github/workflows/source-layout-audit-test.yml"
  pull_request:
    paths:
      - "tools/audit_source_layouts.py"
      - "tools/test_audit_source_layouts.py"
      - ".github/workflows/source-layout-audit-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run source audit unit tests
        run: python -m unittest tools/test_audit_source_layouts.py -v
