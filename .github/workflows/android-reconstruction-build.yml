name: Android reconstruction build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_built_apk.py"
      - ".github/scripts/test_verify_built_apk.py"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-reconstruction-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-reconstruction-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test APK package verifier
        run: python3 -B .github/scripts/test_verify_built_apk.py

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify compiled APK package and resources
        run: >-
          python3 -B .github/scripts/verify_built_apk.py
          app/build/outputs/apk/debug/app-debug.apk
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --output app/build/outputs/apk/debug/apk-build-receipt.json

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marrow-reconstruction-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk-build-receipt.json
          if-no-files-found: error
