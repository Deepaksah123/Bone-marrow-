name: Reconstruction evidence guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify original APK identity and incomplete parity status
        shell: bash
        run: |
          set -euo pipefail
          test -f analysis/APK_SHA256.txt
          grep -Fxq 'e03a582c20eec102510509918315be53e45bb9fe90647207b2c956a0f55316a3  base.apk' analysis/APK_SHA256.txt
          grep -Fq 'Original APK SHA-256 recorded in' reconstruction/EXACT_SOURCE_UI_INDEX.md
          grep -Fq 'Source-to-screen/behavior map — **PARTIAL**.' reconstruction/1TO1_READINESS_AUDIT.md
          grep -Fq 'Ads/payment/subscription/monetization remain excluded.' reconstruction/SOURCE_TO_SCREEN_MAP.md

      - name: Validate source-traced layout IDs and XML
        run: python3 -B .github/scripts/verify_source_bound_layouts.py
