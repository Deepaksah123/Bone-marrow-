name: Reconstruction evidence guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository only
        uses: actions/checkout@v4
      - name: Validate evidence boundary and readiness claims
        shell: bash
        run: |
          set -euo pipefail
          test -f analysis/APK_SHA256.txt
          grep -Fq 'e03a582c20eec102510509918315be53e45bb9fe90647207b2c956a0f55316a3' analysis/APK_SHA256.txt
          test -f reconstruction/EXACT_SOURCE_UI_INDEX.md
          grep -Fq '`resources/res/layout/` direct entries: **578**' reconstruction/EXACT_SOURCE_UI_INDEX.md
          grep -Fq 'directly verified against the ZIP' reconstruction/SOURCE_TO_SCREEN_MAP.md
          grep -Fq 'PARTIAL, NOT RESOLVED' reconstruction/1TO1_READINESS_AUDIT.md
          # Exact-source asset checks: fail closed if any restored binary/text asset is altered.
          echo '7c72ee056690ed4f695e3a7bb656b2fa7d669ff2235ae8a0701485384eb32b93  app/src/main/assets/lottie/practical_corner_zen_area_pulse_anim.json' | sha256sum --check
          echo '956dc7df0fa49e7065da2a41ae00637f258abc0f15f28707eacf43484ce464e7  app/src/main/res/drawable-mdpi/ic_pc_circle_including_logo.webp' | sha256sum --check
          echo 'cf93b9ccb0aaf959c173f683f51f94cf80a72ed24c42c385f5b7f8c8ba79d958  app/src/main/res/drawable/bg_practical_corner_zen_area_gradient_dark.xml' | sha256sum --check
          grep -Fq 'lottie/practical_corner_zen_area_pulse_anim.json' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq '@drawable/ic_pc_circle_including_logo' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq '@dimen/practical_corner_home_banner_content_top_margin' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'android:layout_marginTop="@dimen/practical_corner_home_banner_content_top_margin"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq '<dimen name="practical_corner_home_banner_content_top_margin">4dp</dimen>' app/src/main/res/values/dimens.xml
          grep -Fq '<dimen name="practical_corner_home_banner_content_top_margin">28dp</dimen>' app/src/main/res/values-v35/dimens.xml
          test ! -f app/src/main/res/drawable/ic_practical_corner_zen_are_pattern.xml
          # Zen include identity/order checks from the decoded binary layout.
          for id in zenContainer toolbarPlaceholder ivZenAreaBackground lyt_zen_area_content logoAnimationBackground logoAnimation lytZenAreaCta tvPcZenTitle tvZenCompletedModules; do
            grep -Fq "android:id=\"@+id/$id\"" app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          done
          grep -Fq 'android:src="@drawable/ic_pc_circle_including_logo"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'android:text="Practicals"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'android:text="9/35 modules"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'android:paddingBottom="21dp"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'android:layout_marginTop="4dp"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'app:layout_constraintBottom_toBottomOf="parent"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'style="?attr/heading5"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          grep -Fq 'style="?attr/bodySmall"' app/src/main/res/layout/layout_dynamic_zen_area_replica.xml
          # Home completion UI values verified from original binary XML.
          grep -Fq 'android:layout_marginBottom="@dimen/margin_20dp"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'style="?attr/heading1"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:layout_width="@dimen/module_circular_progress_size"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:layout_height="@dimen/module_circular_progress_size"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:progress="100"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:autoSizeMinTextSize="12sp"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:autoSizeMaxTextSize="36sp"' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq 'android:layout_marginBottom="16dp"' app/src/main/res/layout/fragment_home_replica.xml
          # Home shimmer subtree is source-backed; it contains skeletons only, never fake lessons.
          test -f app/src/main/res/layout/layout_home_cards_shimmer_m2.xml
          test -f app/src/main/res/layout/layout_home_lesson_shimmer_m2.xml
          test -f app/src/main/res/layout/layout_home_lesson_shimmer.xml
          grep -Fq 'layout="@layout/layout_home_cards_shimmer_m2"' app/src/main/res/layout/fragment_home_replica.xml
          test "$(grep -o 'layout="@layout/layout_home_lesson_shimmer_m2"' app/src/main/res/layout/fragment_home_replica.xml | wc -l)" -eq 6
          test "$(grep -o 'layout="@layout/layout_home_lesson_shimmer"' app/src/main/res/layout/fragment_home_replica.xml | wc -l)" -eq 6
          echo '8c22e2695951e8c94a757e24fc4664f8c19e1d8c5bf054d80bc53360c0f689d2  app/src/main/res/drawable/bg_rounded_white_no_stroke.xml' | sha256sum --check
          echo '2abf2eab5516be8c1f73b0b3178f3e4578a70d99f015ccd84fe3244473fdf379  app/src/main/res/drawable/ic_marrow_logo_m.xml' | sha256sum --check
          echo '394e990f90c86a11a747fdaf027be3b89210da12cc36ef66f8718e3e54690ac7  app/src/main/res/drawable/ic_complete.xml' | sha256sum --check
          # Tests landing and toolbar geometry from decoded original layouts.
          grep -Fq 'android:layout_height="@dimen/tab_height"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'app:tabMode="fixed"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'app:tabGravity="fill"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'android:paddingTop="4dp"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'android:paddingBottom="6dp"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'app:expandedTitleMarginStart="@dimen/home_test_toolbar_horizontal_margin"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'android:paddingBottom="@dimen/margin_10dp"' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq 'style="?attr/heading4"' app/src/main/res/layout/test_tab_toolbar_replica.xml
          grep -Fq 'android:background="?attr/colorSurfaceVariant5"' app/src/main/res/layout/test_tab_toolbar_replica.xml
          grep -Fq '<color name="mb_50">#62c8df</color>' app/src/main/res/values/colors.xml
          grep -Fq '<color name="n_80">#313434</color>' app/src/main/res/values/colors.xml
          # Visible Video landing controls use source light/dark attributes and spacing.
          grep -Fq 'android:background="?attr/colorSurfaceVariant13"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'style="?attr/heading6"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'app:thumbTint="?attr/onBackgroundSurface5"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'app:trackTint="?attr/onSurfaceBgOutline"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:paddingVertical="@dimen/pad_8dp"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:paddingHorizontal="@dimen/pad_14"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:layout_marginHorizontal="@dimen/pad_14"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:layout_marginVertical="@dimen/margin_40"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'style="@style/SwitchTheme"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:layout_marginTop="@dimen/margin_4dp"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'app:layout_goneMarginTop="@dimen/margin_20dp"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq '<attr name="colorSurfaceVariant13" format="color" />' app/src/main/res/values/attrs.xml
          grep -Fq '<color name="sepia85">#fbe795</color>' app/src/main/res/values/colors.xml
          grep -Fq '<color name="brown13">#584b19</color>' app/src/main/res/values/colors.xml
          grep -Fq '<item name="colorSurfaceVariant13">@color/sepia85</item>' app/src/main/res/values/styles.xml
          grep -Fq '<item name="colorSurfaceVariant13">@color/brown13</item>' app/src/main/res/values-night/styles.xml
          grep -Fq 'android:id="@+id/layoutContinueWatchingVideoSuggestionCard"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -A2 -Fq 'android:id="@+id/layoutContinueWatchingVideoSuggestionCard"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'layout="@layout/layout_continue_watching_video_suggestion_card"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'layout="@layout/layout_video_watch_next_card"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'android:background="?attr/backgroundColor"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq '<color name="mb_90">#16343b</color>' app/src/main/res/values/colors.xml
          grep -Fq '<color name="n_60">#626768</color>' app/src/main/res/values/colors.xml
          # Resource-table-resolved AppThemeV2 dark theme mappings.
          grep -Fq '<color name="n_70_a_50">#804a4d4e</color>' app/src/main/res/values/colors.xml
          grep -Fq '<color name="c_7eaaff">#ff7eaaff</color>' app/src/main/res/values/colors.xml
          grep -Fq '<item name="onSurfaceBgLinks">@color/c_7eaaff</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="onSurfaceBgOutline2">@color/n_70_a_50</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="colorOnSurface">@color/n_60</item>' app/src/main/res/values/styles.xml
          grep -Fq '<item name="colorOnSurface">@color/n_10</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="onBackgroundSurface1">@color/n_70</item>' app/src/main/res/values/styles.xml
          grep -Fq '<item name="onBackgroundSurface1">@color/white</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="onBackgroundSurface6">@color/green03</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="onBackgroundSurface7">@color/c_fce897</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<item name="onSurfaceBgOutline2">@color/white</item>' app/src/main/res/values/styles.xml
          grep -Fq '<item name="onSurfaceBgOutline3">@color/c_8e9984</item>' app/src/main/res/values-night/styles.xml
          grep -Fq '<color name="blue4">#4da3b6</color>' app/src/main/res/values/colors.xml
          grep -Fq '<color name="green03">#c0ed86</color>' app/src/main/res/values/colors.xml
          # Source typography: SmallText2 inherits the 10sp/12sp Caption metrics.
          grep -Fq 'style name="TextAppearance.Dr.Caption" parent="TextAppearance.MaterialComponents.Caption"' app/src/main/res/values/styles.xml
          grep -Fq '<item name="android:textSize">10sp</item>' app/src/main/res/values/styles.xml
          grep -Fq '<item name="lineHeight">12sp</item>' app/src/main/res/values/styles.xml
          grep -Fq 'style name="TextAppearance.Dr.SmallText2" parent="TextAppearance.Dr.Caption"' app/src/main/res/values/styles.xml
          grep -Fq '<item name="android:fontFamily">sans-serif-medium</item>' app/src/main/res/values/styles.xml
          # Exact-source assets for the non-monetization Continue Watching card.
          echo 'a5f07798d8dcc95bf425d33e411872d6634c9de8e2f8c1cd67e77d02a6e53d64  app/src/main/res/drawable/ic_marrow_logo_blue.xml' | sha256sum --check
          echo 'a06a2c05486e22248ee0e82ec36e914b599e7d6d47c5a4c334f44f26878f1421  app/src/main/res/drawable/ic_playback_play.xml' | sha256sum --check
          echo '33bea6070bfcaa443b8eb76eb3c9599a7859bc78614b76194666025038969ee6  app/src/main/res/drawable/circle_4d000000.xml' | sha256sum --check
          echo 'f4a9f7a6fd6e080c10881554f592dd17a4fc2d7d0e13d3bfd85384433660b4da  app/src/main/res/drawable/ic_switch_orientation_close.xml' | sha256sum --check
          echo '61b810044ec2d8965a57a8dacd525d02e4cf3c97b37049f0e766311cc5978b32  app/src/main/res/drawable/bg_progressbar_blue_background.xml' | sha256sum --check
          test -f app/src/main/res/layout/layout_continue_watching_video_suggestion_card.xml
          grep -Fq 'layout="@layout/layout_continue_watching_video_suggestion_card"' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -A1 'android:id="@+id/layoutVideoWatchNextCard"' app/src/main/res/layout/fragment_video_landing_replica.xml | grep -Fq 'layout="@layout/layout_video_watch_next_card"'
          grep -A1 'android:id="@+id/layoutContinueWatchingVideoSuggestionCard"' app/src/main/res/layout/fragment_video_landing_replica.xml | grep -Fq 'layout="@layout/layout_continue_watching_video_suggestion_card"'
          echo '26b87f708a4ce0b71dbbf2f25513cd0c08329068b7e75879eaf9ccb43edd6539  app/src/main/res/drawable/ic_watch_next_placeholder.xml' | sha256sum --check
          echo '57431419c80ad5352cc05d38d94700c1df1e166b84406976a98cdf07704c3aad  app/src/main/res/drawable-nodpi/right_arrow.png' | sha256sum --check
          test -f app/src/main/res/layout/layout_video_watch_next_card.xml
          grep -Fq 'android:id="@+id/tvWatchNext"' app/src/main/res/layout/layout_video_watch_next_card.xml
          grep -Fq 'android:id="@+id/tvVideoRemainingDuration"' app/src/main/res/layout/layout_video_watch_next_card.xml
          # All four home tabs inflate source-shaped XML roots; no synthetic screen content entry point.
          # Direct-ID coverage from decoded source roots; monetization-only Home IDs remain excluded.
          test "$(grep -o 'android:id="@+id/' app/src/main/res/layout/fragment_home_replica.xml | wc -l)" -eq 17
          test "$(grep -o 'android:id="@+id/' app/src/main/res/layout/fragment_qbank_landing_replica.xml | wc -l)" -eq 2
          test "$(grep -o 'android:id="@+id/' app/src/main/res/layout/fragment_home_test_replica.xml | wc -l)" -eq 9
          test "$(grep -o 'android:id="@+id/' app/src/main/res/layout/fragment_video_landing_replica.xml | wc -l)" -eq 44
          grep -Fq '<androidx.constraintlayout.widget.ConstraintLayout' app/src/main/res/layout/fragment_home_replica.xml
          grep -Fq '<androidx.constraintlayout.widget.ConstraintLayout' app/src/main/res/layout/fragment_qbank_landing_replica.xml
          grep -Fq '<androidx.constraintlayout.widget.ConstraintLayout' app/src/main/res/layout/fragment_home_test_replica.xml
          grep -Fq '<FrameLayout' app/src/main/res/layout/fragment_video_landing_replica.xml
          grep -Fq 'case 1: layout = R.layout.fragment_qbank_landing_replica;' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'case 2: layout = R.layout.fragment_home_test_replica;' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'case 3: layout = R.layout.fragment_video_landing_replica;' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'default: layout = R.layout.fragment_home_replica;' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'transaction.remove(fragment);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'transaction.hide(fragment);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'String destinationTag = sourceDestinationTagFor(selectedTab);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'transaction.add(R.id.upperContainer, destination, destinationTag);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'transaction.show(destination);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'return "Home_kotlin.makeGooglePlayServicesAvailable";' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'return "Home_kotlin.ResidentKeyRequirementUnsupportedResidentKeyRequirementException";' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'return "Home_kotlin.WalletConstantsCardNetwork";' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'return "Home_kotlin.setScrollPosition";' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'View root = LayoutInflater.from(this).inflate(layout, parent, false);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'private View buildHome()' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'private View buildQbank()' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'private View buildTests()' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'private View buildVideos()' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'Module completion' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          # Shell toolbar and bottom navigation source geometry/theme.
          grep -Fq 'android:background="?attr/backgroundColor"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:background="?attr/colorSurfaceVariant5"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:minHeight="?attr/actionBarSize"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:layout_width="?attr/actionBarSize"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'style="?attr/heading5"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'style="?attr/heading4"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:background="?attr/onSurfaceBgOutline2"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'app:tabMode="scrollable"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'app:tabTextAppearance="?attr/smallText2"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'tabLayout.setTabMode(TabLayout.MODE_SCROLLABLE);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'tabLayout.setTabMode(TabLayout.MODE_FIXED);' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          # Exact custom tab hierarchy and source icon/label IDs.
          echo '6b067450320cdd08f214798cfebee2c4644d3e28b0a3c40009ac3ffdefb00780  app/src/main/res/drawable/ic_home_indicator.xml' | sha256sum --check
          grep -Fq 'android:id="@+id/icon"' app/src/main/res/layout/item_home_tab.xml
          grep -Fq 'android:id="@+id/indicator"' app/src/main/res/layout/item_home_tab.xml
          grep -Fq 'android:id="@+id/title"' app/src/main/res/layout/item_home_tab.xml
          grep -Fq 'android:layout_width="20dp"' app/src/main/res/layout/item_home_tab.xml
          grep -Fq 'android:layout_marginTop="@dimen/margin_3dp"' app/src/main/res/layout/item_home_tab.xml
          grep -Fq 'custom.findViewById(R.id.icon)' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'custom.findViewById(R.id.title)' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'R.id.tab_icon' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          ! grep -Fq 'R.id.tab_label' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'app:tabSelectedTextColor="?attr/colorPrimary"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:layout_margin="8dp"' app/src/main/res/layout/activity_main.xml
          grep -Fq 'android:id="@+id/ivVideoThumbnail"' app/src/main/res/layout/layout_continue_watching_video_suggestion_card.xml
          grep -Fq 'android:id="@+id/pbSuggestedVideo"' app/src/main/res/layout/layout_continue_watching_video_suggestion_card.xml
          grep -Fq 'android:id="@+id/tvVideoRemainingDuratiom"' app/src/main/res/layout/layout_continue_watching_video_suggestion_card.xml
          grep -Fq 'style="@style/HorizontalProgressBarVideoDownload"' app/src/main/res/layout/layout_continue_watching_video_suggestion_card.xml
          # Batch 30 lifecycle and optional-root regression checks.
          test "$(grep -Fc 'onSaveInstanceState(Bundle out)' app/src/main/java/com/marrow/reconstruction/MainActivity.java)" -eq 1
          grep -Fq 'if (cards != null)' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'if (subjects != null)' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          grep -Fq 'if (list != null)' app/src/main/java/com/marrow/reconstruction/MainActivity.java
          if find . -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | grep -q .; then
            echo 'Android build files detected. This guard is not a substitute for source-grounded build/tests.'
          else
            echo 'Evidence guard passed. No Android module detected; this validates evidence docs only, not UI/build correctness.'
          fi
