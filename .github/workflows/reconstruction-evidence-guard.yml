name: Reconstruction evidence guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository only
        uses: actions/checkout@v4
      - name: Validate evidence boundary and readiness claims
        shell: bash
        run: |
          set -euo pipefail
          test -f analysis/APK_SHA256.txt
          grep -q 'e03a582c20eec102510509918315be53e45bb9fe90647207b2c956a0f55316a3' analysis/APK_SHA256.txt
          test -f reconstruction/EXACT_SOURCE_UI_INDEX.md
          grep -q '`resources/res/layout/` entries: **578**' reconstruction/EXACT_SOURCE_UI_INDEX.md
          grep -q 'directly verified against the ZIP' reconstruction/SOURCE_TO_SCREEN_MAP.md
          grep -q 'PARTIAL, NOT RESOLVED' reconstruction/1TO1_READINESS_AUDIT.md
          if grep -Eqi 'exact (original )?(screen )?tree (is )?(complete|resolved)|layout XML entries.*578' reconstruction/SOURCE_TO_SCREEN_MAP.md; then
            echo 'Evidence guard failed: unverified resource/tree claim detected.'
            exit 1
          fi
          if find . -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | grep -q .; then
            echo 'Android build files detected. This guard is not a substitute for source-grounded build/tests.'
          else
            echo 'Evidence guard passed. No Android module detected; this validates evidence docs only, not UI/build correctness.'
          fi
