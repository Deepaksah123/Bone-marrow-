name: Android UI smoke and screenshot QA

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_android_ui_smoke_workflow.py"
      - ".github/workflows/android-ui-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_android_ui_smoke_workflow.py"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  # Keep only the newest emulator smoke run for this ref; duplicate cold boots
  # have left multiple System UI instances stalled and competing for runner resources.
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target repository only
        uses: actions/checkout@v4

      - name: Verify bounded emulator execution and QA evidence retention
        run: |
          python3 -B .github/scripts/verify_android_ui_smoke_workflow.py

      - name: Verify original-source replica layout bindings
        run: |
          python3 -B .github/scripts/verify_source_bound_layouts.py

      - name: Test ANR detection and source-bound accessibility targeting
        run: |
          python3 -B .github/scripts/test_android_ui_smoke.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare QA evidence directory before emulator startup
        run: |
          mkdir -p qa-screenshots
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "emulator_script_invoked=false"
          } > qa-screenshots/run-context.txt

      - name: Launch emulator, verify tab navigation, capture screenshots
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # The API 30 / 2 GiB / 2-core image repeatedly froze System UI during
          # cold boot (visible ANR, >5 minute display freeze) before app QA.
          # Use the already-installed target platform's API level and a less
          # constrained emulator so a system-image ANR cannot masquerade as app QA.
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -noaudio -memory 4096 -cores 4
          script: |
            python3 .github/scripts/run_android_ui_smoke.py > qa-screenshots/smoke-run.log 2>&1
            status=$?
            cat qa-screenshots/smoke-run.log
            exit "$status"

      - name: Upload UI smoke screenshots, interaction captures, and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-ui-smoke-qa
          path: qa-screenshots/
          if-no-files-found: error
          retention-days: 14
