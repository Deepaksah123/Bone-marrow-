name: Android UI smoke and screenshot QA

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_android_ui_smoke_workflow.py"
      - ".github/workflows/android-ui-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_android_ui_smoke_workflow.py"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target repository only
        uses: actions/checkout@v4

      - name: Verify bounded emulator execution and QA evidence retention
        run: |
          python3 -B .github/scripts/verify_android_ui_smoke_workflow.py

      - name: Verify original-source replica layout bindings
        run: |
          python3 -B .github/scripts/verify_source_bound_layouts.py

      - name: Test ANR detection and source-bound accessibility targeting
        run: |
          python3 -B .github/scripts/test_android_ui_smoke.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Launch emulator, verify tab navigation, capture screenshots
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -noaudio -memory 2048 -cores 2
          script: |
            python3 .github/scripts/run_android_ui_smoke.py

      - name: Upload UI smoke screenshots, interaction captures, and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-ui-smoke-qa
          path: qa-screenshots/
          if-no-files-found: error
          retention-days: 14
