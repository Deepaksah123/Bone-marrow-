name: Android UI smoke and screenshot QA

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/workflows/android-ui-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target repository only
        uses: actions/checkout@v4

      - name: Verify original-source replica layout bindings
        run: |
          python3 -B .github/scripts/verify_source_bound_layouts.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Launch emulator, verify tab navigation, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader -noaudio -memory 2048 -cores 2
          script: |
            set -eu
            mkdir -p qa-screenshots
            timeout 120s adb install app/build/outputs/apk/debug/app-debug.apk
            timeout 15s adb shell am force-stop com.marrow.reconstruction.replica
            timeout 45s adb shell am start -n com.marrow.reconstruction.replica/com.marrow.reconstruction.MainActivity
            sleep 2
            timeout 10s adb shell pidof com.marrow.reconstruction.replica | grep -q .
            python3 - <<'PY'
            import re, subprocess, time
            from pathlib import Path

            def adb(args, timeout=20):
                return subprocess.run(["adb", *args], check=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, text=True, timeout=timeout)

            def tap(x, y):
                adb(["shell", "input", "tap", str(x), str(y)], timeout=10)

            def screenshot(name):
                remote = f"/sdcard/{name}.png"
                adb(["shell", "screencap", "-p", remote], timeout=30)
                adb(["pull", remote, f"qa-screenshots/{name}.png"], timeout=30)

            def ensure_app():
                result = adb(["shell", "pidof", "com.marrow.reconstruction.replica"], timeout=10)
                if not result.stdout.strip():
                    raise SystemExit("Reconstruction app process exited during interaction QA")

            size_text = adb(["shell", "wm", "size"], timeout=10).stdout
            density_text = adb(["shell", "wm", "density"], timeout=10).stdout
            size_match = re.search(r"(\d+)x(\d+)", size_text)
            density_match = re.search(r"(\d+)", density_text)
            if not size_match or not density_match:
                raise SystemExit(f"Could not resolve emulator geometry: {size_text!r}; {density_text!r}")
            width, height = map(int, size_match.groups())
            scale = int(density_match.group(1)) / 160.0
            status_and_toolbar_y = round(52 * scale)
            nav_bar_height = round(24 * scale)
            tab_y = height - nav_bar_height - round(28 * scale)
            tab_x = [round(width * (i + 0.5) / 4) for i in range(4)]

            screenshot("home")
            for name, index in (("qbank", 0), ("tests", 1), ("videos", 2), ("home", 3)):
                tap(tab_x[index], tab_y)
                time.sleep(2)
                ensure_app()
                screenshot(name)
                print(f"Captured {name} tab at ({tab_x[index]}, {tab_y})")

            # Drawer and Better Search are source-bound toolbar actions.
            tap(round(24 * scale), status_and_toolbar_y)
            time.sleep(1)
            screenshot("drawer-open")
            adb(["shell", "input", "keyevent", "4"], timeout=10)
            time.sleep(1)

            tap(width - round(24 * scale), status_and_toolbar_y)
            time.sleep(1)
            screenshot("search-open")
            adb(["shell", "input", "keyevent", "4"], timeout=10)
            time.sleep(1)
            ensure_app()

            # Exercise source-backed Intern Mode OFF/ON visual state and tooltip.
            tap(tab_x[2], tab_y)
            time.sleep(2)
            switch_x = width - round(40 * scale)
            row_y = round(104 * scale)
            tap(switch_x, row_y)
            time.sleep(1)
            screenshot("video-switch-on")
            tap(switch_x, row_y)
            time.sleep(1)
            screenshot("video-switch-off")
            tap(round(140 * scale), row_y)
            time.sleep(1)
            screenshot("video-tooltip-open")
            tap(round(292 * scale), round(400 * scale))
            time.sleep(1)
            screenshot("video-tooltip-closed")
            ensure_app()

            # Capture both theme modes after exercising the source-backed tab controls.
            adb(["shell", "cmd", "uimode", "night", "yes"], timeout=20)
            time.sleep(2)
            screenshot("video-dark")
            tap(tab_x[3], tab_y)
            time.sleep(2)
            screenshot("home-dark")
            adb(["shell", "cmd", "uimode", "night", "no"], timeout=20)
            time.sleep(1)
            ensure_app()
            print("Screenshot interaction QA completed.")
            PY

      - name: Upload UI smoke screenshots and interaction captures
        uses: actions/upload-artifact@v4
        with:
          name: marrow-ui-smoke-qa
          path: qa-screenshots/
          if-no-files-found: error
          retention-days: 14
