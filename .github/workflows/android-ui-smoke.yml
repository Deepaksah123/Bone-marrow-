name: Android UI smoke QA

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_built_apk.py"
      - ".github/scripts/test_verify_built_apk.py"
      - ".github/workflows/android-ui-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/verify_source_bound_layouts.py"
      - ".github/scripts/run_android_ui_smoke.py"
      - ".github/scripts/test_android_ui_smoke.py"
      - ".github/scripts/verify_built_apk.py"
      - ".github/scripts/test_verify_built_apk.py"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare QA evidence directory
        run: |
          mkdir -p qa-screenshots
          printf 'commit=%s\nrun_id=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > qa-screenshots/run-context.txt

      - name: Validate source-traced layout IDs and XML
        run: python3 -B .github/scripts/verify_source_bound_layouts.py

      - name: Test smoke QA helpers
        run: python3 -B .github/scripts/test_android_ui_smoke.py

      - name: Test APK package verifier
        run: python3 -B .github/scripts/test_verify_built_apk.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package, resources, and signature
        run: >-
          python3 -B .github/scripts/verify_built_apk.py
          app/build/outputs/apk/debug/app-debug.apk
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          --output qa-screenshots/apk-build-receipt.json

      - name: Run emulator smoke QA
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -noaudio -memory 2048 -cores 2
          script: |
            bash -o pipefail -c 'python3 .github/scripts/run_android_ui_smoke.py 2>&1 | tee qa-screenshots/smoke-run.log'

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marrow-ui-smoke-qa
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
